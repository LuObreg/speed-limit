;stroke-width:0.5;" fill="#FFF8DC"/><text x="471.82" y="512.022" fill="#000" font-size="13" textLength="293.401" font-family="Arial">Several sensors per hour are averaged; gaps of up</text><text x="471.82" y="526.971" fill="#000" font-size="13" textLength="304.262" font-family="Arial">to 6 hours are interpolated, longer gaps are dropped.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="102"><path d="M1008.65,654.319 L1008.65,694.216 L1304.256,694.216 L1304.256,664.319 L1294.256,654.319 L1008.65,654.319" style="stroke:#B8A25A;stroke-width:0.5;" fill="#FFF8DC"/><path d="M1294.256,654.319 L1294.256,664.319 L1304.256,664.319 L1294.256,654.319" style="stroke:#B8A25A;stroke-width:1;" fill="#FFF8DC"/><text x="1014.65" y="671.512" fill="#000" font-size="13" textLength="247.87" font-family="Arial">Only near-accident events are counted into</text><text x="1014.65" y="686.461" fill="#000" font-size="13" textLength="274.606" font-family="Arial">/near_accidents_per_hour (configurable policy).</text></g><!--link SensorType to Sensor--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-source-line="77" data-link-type="association"><path d="M221.45,159.009 C221.45,197.249 221.45,245.809 221.45,274.549" style="stroke:#444;stroke-width:1;" fill="none" id="SensorType-Sensor" codeLine="77"/><polygon points="226.45,202.163,229.389,193.118,223.511,193.118,226.45,202.163" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="235.45" y="201.882" fill="#000" font-size="13" textLength="52.736" font-family="Arial">classifies</text><text x="214.058" y="178.728" fill="#000" font-size="13" font-family="Arial">1</text><text x="199.966" y="264.139" fill="#000" font-size="13" textLength="19.513" font-family="Arial">0..*</text></g><!--reverse link Sensor to SensorReading--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk12" data-source-line="78" data-link-type="com